# fmt + clippy (-D warnings) + tests; matches `.cargo/config.toml` `clippy-check`.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SIFT_NO_DAEMON: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -p sift-core -p sift-grep -- --check

      - name: cargo clippy
        run: cargo clippy -p sift-core -p sift-grep --all-targets --all-features --no-deps -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --exclude regex --exclude regex-automata --exclude regex-syntax --exclude pcre2
